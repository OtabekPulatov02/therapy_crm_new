[tool.poetry]
name = "therapy-crm-backend"
version = "0.1.0"
description = "FastAPI backend for therapy.uz CRM analytics platform"
authors = ["therapy.uz <dev@therapy.uz>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = "^2.0.20"
asyncpg = "^0.29.0"
alembic = "^1.13.0"
python-multipart = "^0.0.9"
pydantic-settings = "^2.3.0"
pandas = "^2.2.0"
numpy = "^2.0.0"
scipy = "^1.11.0"
statsmodels = "^0.14.0"
lifelines = "^0.27.8"
scikit-learn = "^1.5.0"
celery = "^5.3.0"
redis = "^5.0.0"
boto3 = "^1.34.0"
python-docx = "^1.1.0"
weasyprint = "^61.0"
plotly = "^5.22.0"
kaleido = "0.2.1"
jinja2 = "^3.1.2"
tenacity = "^8.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.26.0"
ruff = "^0.5.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

